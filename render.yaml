services:
  - type: web
    name: demo-design-inseguro
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    # --workers 1 é OBRIGATÓRIO: o estado (pedidos/modo) fica na memória do processo.
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ADMIN_TOKEN
        sync: false
