<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Loja Byte</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="aviso">
    <div class="wrap">
      <span>Ambiente de demonstração acadêmica - loja fictícia</span>
      <span id="selo" class="selo" aria-live="polite">...</span>
    </div>
  </div>

  <header class="cabecalho">
    <div class="wrap">
      <a class="logo" href="/">Loja<span>Byte</span></a>
      <div class="cliente">
        <label for="nome">Seu nome</label>
        <input type="text" id="nome" maxlength="30" autocomplete="nickname" placeholder="Como quer ser chamado?">
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="vitrine-topo">
      <h1>Mais vendidos</h1>
      <p>Desafio: compre pelo menor preço possível.</p>
    </div>
    <p id="mensagem" class="mensagem" hidden></p>
    <section id="produtos" class="produtos" aria-label="Produtos">
      <div class="esqueleto" aria-hidden="true"></div>
      <div class="esqueleto" aria-hidden="true"></div>
      <div class="esqueleto" aria-hidden="true"></div>
    </section>
  </main>

  <footer class="rodape">
    <div class="wrap">
      <span>Loja Byte · loja fictícia para fins acadêmicos</span>
      <a href="/painel.html">Pedidos ao vivo</a>
    </div>
  </footer>

  <!-- Cada produto é um <form> com o preço num input hidden. É ESTE valor que o JS envia ao servidor. -->
  <template id="tpl-produto">
    <article class="produto">
      <div class="foto" aria-hidden="true"></div>
      <div class="info">
        <span class="frete">Frete grátis</span>
        <h2 class="titulo"></h2>
        <div class="preco"></div>
        <div class="parcelas"></div>
        <form class="form-compra" action="/api/comprar" method="post" novalidate>
          <input type="hidden" name="produto_id" value="">
          <input type="hidden" name="preco" value="">
          <button type="submit" class="botao">Comprar</button>
        </form>
      </div>
    </article>
  </template>

  <dialog id="confirmacao" class="confirmacao" aria-labelledby="conf-titulo">
    <div class="icone" id="conf-icone" aria-hidden="true"></div>
    <h2 id="conf-titulo"></h2>
    <div class="valor" id="conf-valor"></div>
    <p class="detalhe" id="conf-detalhe"></p>
    <form method="dialog"><button class="botao secundario">Continuar comprando</button></form>
  </dialog>

  <script src="/app.js"></script>
  <script>
    const selo = document.getElementById('selo');
    const lista = document.getElementById('produtos');
    const mensagem = document.getElementById('mensagem');
    const tpl = document.getElementById('tpl-produto');
    const campoNome = document.getElementById('nome');
    const modal = document.getElementById('confirmacao');

    try { campoNome.value = localStorage.getItem('nome') || ''; } catch (_) {}
    campoNome.addEventListener('change', () => {
      try { localStorage.setItem('nome', campoNome.value); } catch (_) {}
    });

    async function carregarStatus() {
      try {
        const r = await api('/api/status');
        if (r.ok) pintarSelo(selo, r.corpo.modo);
      } catch (_) {}
    }

    function confirmar(tipo, icone, titulo, valor, detalhe) {
      modal.className = 'confirmacao ' + tipo;
      document.getElementById('conf-icone').textContent = icone;
      document.getElementById('conf-titulo').textContent = titulo;
      document.getElementById('conf-valor').textContent = valor;
      document.getElementById('conf-detalhe').textContent = detalhe;
      if (modal.open) modal.close();
      modal.showModal();
    }

    async function comprar(evento) {
      evento.preventDefault();
      const form = evento.currentTarget;
      const botao = form.querySelector('button');
      // Lê os inputs NO MOMENTO do envio: editar o value nas DevTools muda o preço enviado.
      const dados = {
        produto_id: form.elements.produto_id.value,
        preco: form.elements.preco.value,
        nome: campoNome.value,
      };
      botao.disabled = true;
      botao.textContent = 'Processando...';
      try {
        const r = await api('/api/comprar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(dados),
        });
        if (!r.ok) {
          confirmar('erro', '⚠️', 'Pedido recusado', '', (r.corpo && r.corpo.erro) || ('Erro ' + r.status));
          return;
        }
        const p = r.corpo;
        pintarSelo(selo, p.modo);
        const adulterado = p.preco_enviado !== null && !(Math.abs(Number(p.preco_enviado) - p.preco_real) <= 0.001);
        if (p.fraude) {
          confirmar('fraude', '😈', 'Pedido aprovado por', brl(p.preco_registrado),
            'Preço real: ' + brl(p.preco_real) + '. O servidor aceitou o valor que o navegador mandou.');
        } else if (p.modo === 'seguro' && adulterado) {
          confirmar('protegido', '🛡️', 'Pedido aprovado por', brl(p.preco_registrado),
            'Você enviou ' + brl(p.preco_enviado) + ', mas o servidor ignorou e buscou o preço no banco.');
        } else {
          confirmar('', '✅', 'Pedido aprovado por', brl(p.preco_registrado),
            p.produto + ' · pedido nº ' + p.id);
        }
      } catch (_) {
        confirmar('erro', '⚠️', 'Sem conexão', '', 'O servidor pode estar acordando. Tente de novo em alguns segundos.');
      } finally {
        botao.disabled = false;
        botao.textContent = 'Comprar';
      }
    }

    function renderizar(produtos) {
      lista.replaceChildren();
      for (const prod of produtos) {
        const frag = tpl.content.cloneNode(true);
        frag.querySelector('.foto').textContent = prod.emoji;
        frag.querySelector('.titulo').textContent = prod.nome;
        frag.querySelector('.preco').textContent = brl(prod.preco);
        frag.querySelector('.parcelas').textContent = 'ou 10x de ' + brl(prod.preco / 10) + ' sem juros';
        const form = frag.querySelector('form');
        form.elements.produto_id.value = prod.id;
        form.elements.preco.value = Number(prod.preco).toFixed(2);
        form.addEventListener('submit', comprar);
        lista.appendChild(frag);
      }
    }

    async function carregarProdutos(tentativa = 1) {
      try {
        const r = await api('/api/produtos');
        if (!r.ok) throw new Error();
        mensagem.hidden = true;
        renderizar(r.corpo);
      } catch (_) {
        mensagem.hidden = false;
        mensagem.textContent = 'Carregando a loja... o servidor pode levar alguns segundos para acordar.';
        setTimeout(() => carregarProdutos(tentativa + 1), Math.min(2000 * tentativa, 8000));
      }
    }

    carregarStatus();
    carregarProdutos();
    setInterval(carregarStatus, 5000);
  </script>
</body>
</html>
